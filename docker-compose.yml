version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dotads_postgres
    restart: always
    environment:
      POSTGRES_DB: dotads_db
      POSTGRES_USER: dotads_user
      POSTGRES_PASSWORD: dotads_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dotads_user -d dotads_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
