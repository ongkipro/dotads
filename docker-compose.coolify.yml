version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: dotads_production_postgres
    restart: always
    environment:
      POSTGRES_USER: dotads_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dotads_password_prod}
      POSTGRES_DB: dotads_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dotads_user -d dotads_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: dotads_pgbouncer
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: dotads_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dotads_password_prod}
      DB_NAME: dotads_db
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dotads_api
    restart: always
    environment:
      PORT: 8787
      DATABASE_URL: postgres://dotads_user:${POSTGRES_PASSWORD:-dotads_password_prod}@pgbouncer:6432/dotads_db
    ports:
      - "8787:8787"
    depends_on:
      - pgbouncer

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: dotads_admin
    restart: always
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://api:8787
    ports:
      - "3000:3000"
    depends_on:
      - api

  storefront:
    build:
      context: .
      dockerfile: Dockerfile.storefront
    container_name: dotads_storefront
    restart: always
    environment:
      PORT: 4321
      PUBLIC_API_URL: http://api:8787
    ports:
      - "4321:4321"
    depends_on:
      - api

volumes:
  postgres_data:
