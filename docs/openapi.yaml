                    "timeZone": {
                      "type": "string",
                      "enum": [
                        "Asia/Jakarta"
                      ]
                    },
                    "period": {
                      "type": "object",
                      "properties": {
                        "days": {
                          "anyOf": [
                            {
                              "type": "number",
                              "enum": [
                                7
                              ]
                            },
                            {
                              "type": "number",
                              "enum": [
                                30
                              ]
                            }
                          ]
                        },
                        "from": {
                          "type": "string",
                          "format": "date-time"
                        },
                        "to": {
                          "type": "string",
                          "format": "date-time"
                        }
                      },
                      "required": [
                        "days",
                        "from",
                        "to"
                      ],
                      "additionalProperties": false
                    },
                    "kpis": {
                      "type": "object",
                      "properties": {
                        "ordersCreated": {
                          "type": "integer",
                          "minimum": 0,
                          "maximum": 9007199254740991
                        },
                        "grossOrderValueMinor": {
                          "type": "integer",
                          "minimum": 0,
                          "maximum": 9007199254740991
                        }
                      },
                      "required": [
                        "ordersCreated",
                        "grossOrderValueMinor"
                      ],
                      "additionalProperties": false
                    },
                    "daily": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "date": {
                            "type": "string",
                            "pattern": "^\\d{4}-\\d{2}-\\d{2}$"
                          },
                          "ordersCreated": {
                            "type": "integer",
                            "minimum": 0,
                            "maximum": 9007199254740991
                          },
                          "grossOrderValueMinor": {
                            "type": "integer",
                            "minimum": 0,
                            "maximum": 9007199254740991
                          }
                        },
                        "required": [
                          "date",
                          "ordersCreated",
                          "grossOrderValueMinor"
                        ],
                        "additionalProperties": false
                      },
                      "maxItems": 30
                    },
                    "breakdowns": {
                      "type": "object",
                      "properties": {
                        "orderStatus": {
                          "type": "object",
                          "properties": {
                            "PENDING_PAYMENT": {
                              "type": "integer",
                              "minimum": 0,
                              "maximum": 9007199254740991
                            },
                            "CONFIRMED": {
                              "type": "integer",
                              "minimum": 0,
                              "maximum": 9007199254740991
                            },
                            "PROCESSING": {
                              "type": "integer",
                              "minimum": 0,
                              "maximum": 9007199254740991
                            },
                            "SHIPPED": {
                              "type": "integer",
                              "minimum": 0,
                              "maximum": 9007199254740991
                            },
                            "DELIVERED": {
                              "type": "integer",
                              "minimum": 0,
                              "maximum": 9007199254740991
                            },
                            "CANCELLED": {
                              "type": "integer",
                              "minimum": 0,
                              "maximum": 9007199254740991
                            },
                            "REFUNDED": {
                              "type": "integer",
                              "minimum": 0,
                              "maximum": 9007199254740991
                            }
                          },
                          "required": [
                            "PENDING_PAYMENT",
                            "CONFIRMED",
                            "PROCESSING",
                            "SHIPPED",
                            "DELIVERED",
                            "CANCELLED",
                            "REFUNDED"
                          ],
                          "additionalProperties": false
                        },
                        "paymentStatus": {
                          "type": "object",
                          "properties": {
                            "UNPAID": {
                              "type": "integer",
                              "minimum": 0,
                              "maximum": 9007199254740991
                            },
                            "PAID": {
                              "type": "integer",
                              "minimum": 0,
                              "maximum": 9007199254740991
                            },
                            "REFUNDED": {
                              "type": "integer",
                              "minimum": 0,
                              "maximum": 9007199254740991
                            },
                            "FAILED": {
                              "type": "integer",
                              "minimum": 0,
                              "maximum": 9007199254740991
                            }
                          },
                          "required": [
                            "UNPAID",
                            "PAID",
                            "REFUNDED",
                            "FAILED"
                          ],
                          "additionalProperties": false
                        },
                        "fulfillmentStatus": {
                          "type": "object",
                          "properties": {
                            "UNFULFILLED": {
                              "type": "integer",
                              "minimum": 0,
                              "maximum": 9007199254740991
                            },
                            "PICKUP_REQUESTED": {
                              "type": "integer",
                              "minimum": 0,
                              "maximum": 9007199254740991
                            },
                            "IN_TRANSIT": {
                              "type": "integer",
                              "minimum": 0,
                              "maximum": 9007199254740991
                            },
                            "DELIVERED": {
                              "type": "integer",
                              "minimum": 0,
                              "maximum": 9007199254740991
                            },
                            "RETURNED": {
                              "type": "integer",
                              "minimum": 0,
                              "maximum": 9007199254740991
                            },
                            "FAILED": {
                              "type": "integer",
                              "minimum": 0,
                              "maximum": 9007199254740991
                            }
                          },
                          "required": [
                            "UNFULFILLED",
                            "PICKUP_REQUESTED",
                            "IN_TRANSIT",
                            "DELIVERED",
                            "RETURNED",
                            "FAILED"
                          ],
                          "additionalProperties": false
                        }
                      },
                      "required": [
                        "orderStatus",
                        "paymentStatus",
                        "fulfillmentStatus"
                      ],
                      "additionalProperties": false
                    }
                  },
                  "required": [
                    "currency",
                    "timeZone",
                    "period",
