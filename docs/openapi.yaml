    "/api/v1/dashboard": {
      "get": {
        "operationId": "getTenantDashboard",
        "tags": [
          "Dashboard"
        ],
        "summary": "Get bounded tenant order aggregates",
        "parameters": [
          {
            "schema": {
              "type": "string",
              "enum": [
                "7",
                "30"
              ],
              "default": "7"
            },
            "required": false,
            "name": "days",
            "in": "query"
