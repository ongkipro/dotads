{
  "openapi": "3.1.0",
  "info": {
    "title": "DotAds v2 Headless API Spec",
    "version": "2.0.0",
    "description": "High-Performance Multi-Tenant Direct-Response Headless API Spec for Super Admin, Tenant Admin, Storefronts & Builders"
  },
  "servers": [
    {
      "url": "http://localhost:8787"
    }
  ],
  "components": {
    "schemas": {},
    "parameters": {}
  },
  "paths": {
    "/api/v1/session": {
      "get": {
        "summary": "Get active tenant session context",
        "responses": {
          "200": {
            "description": "Authenticated tenant session context",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "userId": {
                      "type": "string"
                    },
                    "userEmail": {
                      "type": "string",
                      "format": "email"
                    },
                    "tenantId": {
                      "type": "string"
                    },
                    "organizationId": {
                      "type": "string"
                    },
                    "role": {
                      "type": "string"
                    },
                    "tenantName": {
                      "type": "string"
                    },
                    "tenantStatus": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "userId",
                    "userEmail",
                    "tenantId",
                    "organizationId",
                    "role",
                    "tenantName",
                    "tenantStatus"
                  ]
                }
              }
            }
          },
          "409": {
            "description": "The authenticated user must explicitly select one of multiple workspaces",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "type": "string",
                      "enum": [
                        "Workspace selection required"
                      ]
                    },
                    "code": {
                      "type": "string",
                      "enum": [
                        "WORKSPACE_SELECTION_REQUIRED"
                      ]
                    },
                    "workspaceSelectionRequired": {
                      "type": "boolean",
                      "enum": [
                        true
                      ]
                    }
                  },
                  "required": [
                    "error",
                    "code",
                    "workspaceSelectionRequired"
                  ]
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/platform/tenants": {
      "get": {
        "summary": "List all tenant stores",
        "responses": {
          "200": {
            "description": "List of tenants",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "properties": {
                      "id": {
                        "type": "string",
                        "format": "uuid"
                      },
                      "name": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 255
                      },
                      "slug": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 100
                      },
                      "status": {
                        "type": "string",
                        "enum": [
                          "active",
                          "suspended",
                          "cancelled"
                        ]
                      },
                      "tier": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 50
                      },
                      "customDomain": {
                        "type": "string",
                        "nullable": true,
                        "maxLength": 255
                      },
                      "createdAt": {
                        "type": "string"
                      },
                      "updatedAt": {
                        "type": "string"
                      }
                    },
                    "required": [
                      "id",
                      "name",
                      "slug",
                      "status",
                      "tier",
                      "customDomain",
                      "createdAt",
                      "updatedAt"
                    ]
                  }
                }
              }
            }
          }
        }
      },
      "post": {
        "summary": "Provision a new tenant store",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "name": {
                    "type": "string",
                    "minLength": 2
                  },
                  "slug": {
                    "type": "string",
                    "minLength": 2
                  },
                  "tier": {
                    "type": "string",
                    "enum": [
                      "STARTER",
                      "PRO",
                      "ENTERPRISE"
                    ],
                    "default": "PRO"
                  },
                  "customDomain": {
                    "type": "string"
                  }
                },
                "required": [
                  "name",
                  "slug"
                ]
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Tenant provisioned successfully",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "id": {
                      "type": "string",
                      "format": "uuid"
                    },
                    "name": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 255
                    },
                    "slug": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 100
                    },
                    "status": {
                      "type": "string",
                      "enum": [
                        "active",
                        "suspended",
                        "cancelled"
                      ]
                    },
                    "tier": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 50
                    },
                    "customDomain": {
                      "type": "string",
                      "nullable": true,
                      "maxLength": 255
                    },
                    "createdAt": {
                      "type": "string"
                    },
                    "updatedAt": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "id",
                    "name",
                    "slug",
                    "status",
                    "tier",
                    "customDomain",
                    "createdAt",
                    "updatedAt"
                  ]
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/platform/stats": {
      "get": {
        "summary": "Get platform-wide fleet metrics",
        "responses": {
          "200": {
            "description": "Fleet statistics",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "totalTenants": {
                      "type": "number"
                    },
                    "activeTenants": {
                      "type": "number"
                    },
                    "suspendedTenants": {
                      "type": "number"
                    },
                    "totalGmv": {
                      "type": "number"
                    },
                    "totalOrders": {
                      "type": "number"
                    },
                    "securityAlertsCount": {
                      "nullable": true,
                      "description": "Unavailable until audit records have a defined security severity/classification"
                    }
                  },
                  "required": [
                    "totalTenants",
                    "activeTenants",
                    "suspendedTenants",
                    "totalGmv",
                    "totalOrders",
                    "securityAlertsCount"
                  ]
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/platform/tenants/{id}/status": {
      "patch": {
        "summary": "Suspend or activate a tenant store",
        "parameters": [
          {
            "schema": {
              "type": "string",
              "format": "uuid"
            },
            "required": true,
            "name": "id",
            "in": "path"
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "status": {
                    "type": "string",
                    "enum": [
                      "active",
                      "suspended",
                      "cancelled"
                    ]
                  },
                  "reason": {
                    "type": "string",
                    "minLength": 3,
                    "maxLength": 500
                  }
                },
                "required": [
                  "status",
                  "reason"
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Tenant status updated",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "id": {
                      "type": "string",
                      "format": "uuid"
                    },
                    "name": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 255
                    },
                    "slug": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 100
                    },
                    "status": {
                      "type": "string",
                      "enum": [
                        "active",
                        "suspended",
                        "cancelled"
                      ]
                    },
                    "tier": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 50
                    },
                    "customDomain": {
                      "type": "string",
                      "nullable": true,
                      "maxLength": 255
                    },
                    "createdAt": {
                      "type": "string"
                    },
                    "updatedAt": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "id",
                    "name",
                    "slug",
                    "status",
                    "tier",
                    "customDomain",
                    "createdAt",
                    "updatedAt"
                  ]
                }
              }
            }
          },
          "404": {
            "description": "Tenant not found",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "error"
                  ]
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/platform/tenants/{id}/impersonate": {
      "post": {
        "summary": "Generate impersonation token for tenant support",
        "parameters": [
          {
            "schema": {
              "type": "string",
              "format": "uuid"
            },
            "required": true,
            "name": "id",
            "in": "path"
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "reason": {
                    "type": "string",
                    "minLength": 10,
                    "maxLength": 500
                  }
                },
                "required": [
                  "reason"
                ]
              }
            }
          }
        },
        "responses": {
          "404": {
            "description": "Tenant not found",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "error"
                  ]
                }
              }
            }
          },
          "501": {
            "description": "Impersonation is disabled until signed scoped sessions are implemented",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "error"
                  ]
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/platform/audit-logs": {
      "get": {
        "summary": "List platform audit logs",
        "parameters": [
          {
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 25
            },
            "required": false,
            "name": "limit",
            "in": "query"
          },
          {
            "schema": {
              "type": "integer",
              "nullable": true,
              "minimum": 0,
              "maximum": 10000,
              "default": 0
            },
            "required": false,
            "name": "offset",
            "in": "query"
          },
          {
            "schema": {
              "type": "string",
              "format": "uuid"
            },
            "required": false,
            "name": "tenantId",
            "in": "query"
          },
          {
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 100
            },
            "required": false,
            "name": "action",
            "in": "query"
          },
          {
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 255
            },
            "required": false,
            "name": "actorId",
            "in": "query"
          }
        ],
        "responses": {
          "200": {
            "description": "List of audit log entries",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "items": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "id": {
                            "type": "string",
                            "format": "uuid"
                          },
                          "tenantId": {
                            "type": "string",
                            "nullable": true,
                            "format": "uuid"
                          },
                          "actorId": {
                            "type": "string",
                            "maxLength": 255
                          },
                          "actorEmail": {
                            "type": "string",
                            "maxLength": 255,
                            "format": "email"
                          },
                          "actorRole": {
                            "type": "string",
                            "maxLength": 50
                          },
                          "action": {
                            "type": "string",
                            "maxLength": 100
                          },
                          "targetType": {
                            "type": "string",
                            "maxLength": 50
                          },
                          "targetId": {
                            "type": "string",
                            "maxLength": 255
                          },
                          "createdAt": {
                            "type": "string"
                          }
                        },
                        "required": [
                          "id",
                          "tenantId",
                          "actorId",
                          "actorEmail",
                          "actorRole",
                          "action",
                          "targetType",
                          "targetId",
                          "createdAt"
                        ]
                      }
                    },
                    "pagination": {
                      "type": "object",
                      "properties": {
                        "limit": {
                          "type": "integer",
                          "minimum": 1,
                          "maximum": 100
                        },
                        "offset": {
                          "type": "integer",
                          "minimum": 0,
                          "maximum": 10000
                        },
                        "total": {
                          "type": "integer",
                          "minimum": 0
                        }
                      },
                      "required": [
                        "limit",
                        "offset",
                        "total"
                      ]
                    }
                  },
                  "required": [
                    "items",
                    "pagination"
                  ]
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/admin/members": {
      "get": {
        "summary": "List organization members",
        "responses": {
          "200": {
            "description": "List of members",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "nullable": true
                  }
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/admin/members/invite": {
      "post": {
        "summary": "Invite member to organization",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "email": {
                    "type": "string",
                    "format": "email"
                  },
                  "role": {
                    "type": "string",
                    "enum": [
                      "ADMIN",
                      "ADVERTISER",
                      "CUSTOMER_SERVICE"
                    ]
                  }
                },
                "required": [
                  "email",
                  "role"
                ]
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Invitation created",
            "content": {
              "application/json": {
                "schema": {
                  "nullable": true
                }
              }
            }
          },
          "403": {
            "description": "Forbidden",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "error"
                  ]
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/admin/domains": {
      "get": {
        "summary": "List custom domains",
        "responses": {
          "200": {
            "description": "List of custom domains",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "nullable": true
                  }
                }
              }
            }
          }
        }
      },
      "post": {
        "summary": "Add custom domain",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "hostname": {
                    "type": "string",
                    "minLength": 3,
                    "maxLength": 253,
                    "pattern": "^(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\\.)+[a-zA-Z]{2,63}$"
                  }
                },
                "required": [
                  "hostname"
                ]
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Domain added",
            "content": {
              "application/json": {
                "schema": {
                  "nullable": true
                }
              }
            }
          },
          "403": {
            "description": "Forbidden",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "error"
                  ]
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/admin/audit-logs": {
      "get": {
        "summary": "Get audit logs",
        "responses": {
          "200": {
            "description": "Audit log history",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "nullable": true
                  }
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/admin/forms": {
      "get": {
        "summary": "List form schemas",
        "responses": {
          "200": {
            "description": "List of tenant form schemas",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "nullable": true
                  }
                }
              }
            }
          }
        }
      },
      "post": {
        "summary": "Create form schema draft",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "title": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 255
                  },
                  "slug": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 255,
                    "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$"
                  },
                  "mode": {
                    "type": "string",
                    "enum": [
                      "hybrid",
                      "full",
                      "mini",
                      "middle"
                    ],
                    "default": "hybrid"
                  },
                  "schemaJson": {
                    "type": "object",
                    "properties": {
                      "title": {
                        "type": "string"
                      },
                      "mode": {
                        "type": "string",
                        "enum": [
                          "hybrid",
                          "full",
                          "mini",
                          "middle"
                        ],
                        "default": "hybrid"
                      },
                      "fields": {
                        "type": "array",
                        "items": {
                          "type": "object",
                          "properties": {
                            "id": {
                              "type": "string"
                            },
                            "type": {
                              "type": "string",
                              "enum": [
                                "text",
                                "phone",
                                "email",
                                "textarea",
                                "select",
                                "radio",
                                "checkbox",
                                "address_autocomplete",
                                "quantity",
                                "product_selector",
                                "hidden"
                              ]
                            },
                            "label": {
                              "type": "string"
                            },
                            "placeholder": {
                              "type": "string"
                            },
                            "defaultValue": {
                              "type": "string"
                            },
                            "required": {
                              "type": "boolean",
                              "default": false
                            },
                            "options": {
                              "type": "array",
                              "items": {
                                "type": "object",
                                "properties": {
                                  "label": {
                                    "type": "string"
                                  },
                                  "value": {
                                    "type": "string"
                                  }
                                },
                                "required": [
                                  "label",
                                  "value"
                                ]
                              }
                            },
                            "validations": {
                              "type": "array",
                              "items": {
                                "type": "object",
                                "properties": {
                                  "type": {
                                    "type": "string",
                                    "enum": [
                                      "required",
                                      "minLength",
                                      "maxLength",
                                      "pattern",
                                      "phone_id",
                                      "email"
                                    ]
                                  },
                                  "value": {
                                    "anyOf": [
                                      {
                                        "type": "string"
                                      },
                                      {
                                        "type": "number"
                                      },
                                      {
                                        "type": "boolean"
                                      }
                                    ]
                                  },
                                  "message": {
                                    "type": "string"
                                  }
                                },
                                "required": [
                                  "type"
                                ]
                              }
                            },
                            "conditions": {
                              "type": "array",
                              "items": {
                                "type": "object",
                                "properties": {
                                  "fieldId": {
                                    "type": "string"
                                  },
                                  "operator": {
                                    "type": "string",
                                    "enum": [
                                      "equals",
                                      "not_equals",
                                      "contains",
                                      "is_empty",
                                      "is_not_empty"
                                    ]
                                  },
                                  "value": {
                                    "type": "string"
                                  },
                                  "action": {
                                    "type": "string",
                                    "enum": [
                                      "show",
                                      "hide",
                                      "require",
                                      "disable"
                                    ]
                                  }
                                },
                                "required": [
                                  "fieldId",
                                  "operator",
                                  "action"
                                ]
                              }
                            }
                          },
                          "required": [
                            "id",
                            "type",
                            "label"
                          ]
                        }
                      },
                      "submitButtonText": {
                        "type": "string",
                        "default": "Pesan Sekarang"
                      },
                      "paymentMethods": {
                        "type": "array",
                        "items": {
                          "type": "string"
                        },
                        "default": [
                          "COD",
                          "QRIS"
                        ]
                      },
                      "styleTokens": {
                        "type": "object",
                        "properties": {
                          "primaryColor": {
                            "type": "string",
                            "default": "#000000"
                          },
                          "borderRadius": {
                            "type": "string",
                            "default": "8px"
                          },
                          "fontSize": {
                            "type": "string",
                            "default": "16px"
                          },
                          "fontFamily": {
                            "type": "string",
                            "default": "sans-serif"
                          },
                          "customCss": {
                            "type": "string"
                          }
                        }
                      }
                    },
                    "required": [
                      "title",
                      "fields"
                    ]
                  }
                },
                "required": [
                  "title",
                  "slug",
                  "schemaJson"
                ]
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Form schema created",
            "content": {
              "application/json": {
                "schema": {
                  "nullable": true
                }
              }
            }
          },
          "403": {
            "description": "Forbidden",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "error"
                  ]
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/admin/forms/{id}/publish": {
      "post": {
        "summary": "Publish form schema version",
        "parameters": [
          {
            "schema": {
              "type": "string",
              "format": "uuid"
            },
            "required": true,
            "name": "id",
            "in": "path"
          }
